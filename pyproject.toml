[project]
name = "library-metadata-lookup"
version = "0.1.0"
license = "PolyForm-Noncommercial-1.0.0"
description = "WXYC library catalog lookup service with Discogs integration"
requires-python = ">=3.12"
readme = "README.md"
authors = [
    {name = "WXYC Engineering"}
]

dependencies = [
    # Upper bound: FastAPI 0.137.0 (2026-06-14) reshaped `app.routes` to wrap
    # `include_router(...)` calls in `_IncludedRouter`, breaking the
    # route-introspection tests in `tests/unit/test_{auth,main}.py`. Drop the
    # `<0.137` cap once those tests are migrated to walk the new shape. See
    # WXYC/library-metadata-lookup#562 (immediate pin) and #563 (test migration).
    "fastapi>=0.104.0,<0.137",
    "uvicorn>=0.24.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
    "aiosqlite>=0.19.0",
    "asyncpg>=0.29.0",
    "rapidfuzz>=3.0.0",
    "cachetools>=5.0.0",
    # 1.5.0 adds the keyword-only `before_send_transaction` passthrough on
    # `init_sentry`, the only hook that can drop individual child spans (by
    # filtering `event["spans"]`). Required by LML#1175 to shed the asyncpg
    # connection-reset span. See WXYC/wxyc-fastapi#40.
    "wxyc-fastapi[posthog]>=1.5.0,<2.0.0",
    "aiolimiter>=1.1.0",
    "python-multipart>=0.0.6",
    "wxyc-etl>=0.10.0,<0.11.0",
    "pyjwt[crypto]>=2.8.0",
    # boto3 is a RUNTIME dep, not dev-only: the library.db boot-fetch (main.py
    # lifespan) and the /admin upload paths both call the S3ObjectStore, and the
    # Docker image installs runtime deps only — a dev-only boto3 would ImportError
    # at boot. See WXYC/library-metadata-lookup#835 (volume-eviction PR 1).
    "boto3>=1.34.0",
    # ytmusicapi became a RUNTIME dep in LML#1103, for the same reason boto3
    # above is one: the Docker image installs runtime deps only, and the
    # YouTube Music client is now reachable from /lookup (the streaming-URL
    # cache warm, behind LML_PERSIST_STREAMING_URL_YOUTUBE_MUSIC). It was a
    # `drain` extra while the offline coverage drain (LML#1056) was the only
    # caller. The import is still lazy, so an extra-only version fails not at
    # boot but on the first request that reaches the warm -- and every warm
    # after it, since the warm path deliberately retries through a fresh error
    # row. `tests/unit/test_packaging_manifest.py` now fails on that shape.
    #
    # Pinned exactly (not >=) because it is a reverse-engineered web client
    # whose internal API Google changes periodically; bumps should be
    # deliberate, changelog-reviewed PRs. The pin now carries production
    # weight, not just the drain's: a broken bump is a live outage of the YTM
    # leg rather than a drain rerun.
    "ytmusicapi==1.12.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-httpx>=0.22.0",
    "pytest-cov>=4.0.0",
    # pytest-xdist parallelizes the Default Tests job across the runner's cores
    # (`-n auto`). The suite is ~5k independent unit tests; each xdist worker is
    # its own process, so the per-loop rate-limit/semaphore singletons and moto's
    # in-process S3 mock stay isolated. Only the Default job uses it — the pg and
    # external_api jobs stay serial (shared PG schema / Discogs rate budget).
    "pytest-xdist>=3.5.0",
    # ruff, mypy, and datamodel-code-generator are pinned (not >=) so a new
    # release that changes lint rules, type-check rules, or generated-code
    # formatting cannot silently fail CI on an unrelated PR. Bumps should be
    # deliberate, reviewable PRs. See WXYC/library-metadata-lookup#244 (mypy)
    # and #249 (datamodel-codegen + ruff).
    "ruff==0.15.6",
    "mypy==1.19.1",
    "datamodel-code-generator[http]==0.56.1",
    # moto mocks S3 in-process for the object-store tests (WXYC#835). No pytest
    # marker needed — it patches botocore's HTTP layer, so no network or service.
    "moto[s3]>=5.0.0",
]
# The `drain` extra is retained as a stable name for the offline YouTube Music
# coverage drain (LML#1056) — `uv run --extra drain python -m
# scripts.ytm_coverage_drain` keeps working — but it is now empty: ytmusicapi
# moved into [project].dependencies in LML#1103 when the client became
# reachable from /lookup. See its comment there for why an extra was the wrong
# home once that happened.
drain = []

[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Kept in lockstep with the actual top-level package layout by
# tests/unit/test_packaging_manifest.py (LML#1132) -- a new top-level
# __init__.py-carrying directory that isn't added here fails that test.
# py-modules = ["main"] is deliberately NOT added: Dockerfile's dependency
# layer (`COPY pyproject.toml ./` then `pip install .`) installs from a
# context containing only pyproject.toml, so an explicit py-modules entry
# would hard-fail on the missing main.py. Making the package genuinely
# installable needs a Dockerfile reorder that forfeits that layer's cache --
# out of scope here.
include = ["core*", "config*", "library*", "discogs*", "lookup*", "routers*", "services*", "generated*", "scripts*", "entity*", "clients*", "storage*", "artists*", "identity*", "release*", "streaming*", "cache*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4"]
ignore = ["E501", "B008", "C901"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"generated/*" = ["N815"]

[tool.mypy]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "generated.*"
ignore_errors = true

# One-off streaming-pipeline scripts: archived as historical record of the
# methods described in `streaming_analysis_report.md`. Not actively maintained,
# so mypy enforcement is relaxed. Add new entries sparingly — service code and
# new pipeline scripts should remain fully typed.
[[tool.mypy.overrides]]
module = [
    "scripts.canonicalize_albums",
    "scripts.canonicalize_compilations",
    "scripts.enrich_discogs_matches",
    "scripts.musicbrainz_matching",
    "scripts.revalidate_misses",
    "scripts.revalidate_spotify",
    "scripts.spotify_artist_catalog",
    "scripts.validate_streaming_urls",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["wxyc_etl", "wxyc_etl.*", "asyncpg", "asyncpg.*", "psycopg", "psycopg.*"]
ignore_missing_imports = true
follow_untyped_imports = true

[tool.pytest.ini_options]
markers = [
    "pg: needs a PostgreSQL service (DATABASE_URL_TEST)",
    "external_api: needs network + a real API key (e.g. DISCOGS_TOKEN)",
]
addopts = "-m 'not pg and not external_api'"
console_output_style = "progress"
testpaths = ["tests"]
pythonpath = ["."]
