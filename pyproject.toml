[project]
name = "library-metadata-lookup"
version = "0.1.0"
description = "WXYC library catalog lookup service with Discogs integration"
requires-python = ">=3.12"
readme = "README.md"
authors = [
    {name = "WXYC Engineering"}
]

dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
    "aiosqlite>=0.19.0",
    "asyncpg>=0.29.0",
    "rapidfuzz>=3.0.0",
    "cachetools>=5.0.0",
    "posthog>=3.0.0",
    "aiolimiter>=1.1.0",
    "sentry-sdk[fastapi]>=2.0.0",
    "python-multipart>=0.0.6",
    "wxyc-etl>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-httpx>=0.22.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "datamodel-code-generator[http]>=0.26.0",
]

[tool.uv.sources]
wxyc-etl = { path = "../wxyc-etl/wxyc-etl-python", editable = true }

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "config*", "library*", "discogs*", "lookup*", "routers*", "services*", "generated*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4"]
ignore = ["E501", "B008", "C901"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"generated/*" = ["N815"]

[tool.mypy]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "generated.*"
ignore_errors = true

# One-off streaming-pipeline scripts: archived as historical record of the
# methods described in `streaming_analysis_report.md`. Not actively maintained,
# so mypy enforcement is relaxed. Add new entries sparingly — service code and
# new pipeline scripts should remain fully typed.
[[tool.mypy.overrides]]
module = [
    "scripts.bandcamp_lookup",
    "scripts.bandcamp_search",
    "scripts.canonicalize_albums",
    "scripts.canonicalize_compilations",
    "scripts.enrich_discogs_matches",
    "scripts.kagi_streaming_search",
    "scripts.match_compilations",
    "scripts.merge_cta",
    "scripts.musicbrainz_matching",
    "scripts.revalidate_misses",
    "scripts.revalidate_spotify",
    "scripts.spotify_artist_catalog",
    "scripts.validate_streaming_urls",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["wxyc_etl", "wxyc_etl.*", "asyncpg", "asyncpg.*"]
ignore_missing_imports = true
follow_untyped_imports = true

[tool.pytest.ini_options]
markers = [
    "pg: needs a PostgreSQL service (DATABASE_URL_TEST)",
    "external_api: needs network + a real API key (e.g. DISCOGS_TOKEN)",
]
addopts = "-m 'not pg and not external_api'"
console_output_style = "progress"
testpaths = ["tests"]
pythonpath = ["."]
