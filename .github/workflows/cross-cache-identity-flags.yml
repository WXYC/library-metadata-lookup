name: Cross-cache-identity flag-doc consistency

# Asserts that the LML-owned cross-cache-identity feature flags listed in
# docs/env-vars.md match the §4.2 locked inventory. Runs on every PR
# (including doc-only ones — the existing ci.yml ignores `*.md` paths, but
# this check specifically guards drift of the flag table, so it must run
# unconditionally on changes that could affect it).
#
# Plan reference: WXYC/wiki plans/library-hook-canonicalization-plan.md §4.2.

on:
  pull_request:
    paths:
      - 'docs/env-vars.md'
      - 'CLAUDE.md'
      - 'scripts/check_cross_cache_identity_flags.sh'
      - '.github/workflows/cross-cache-identity-flags.yml'
  push:
    branches: [main, prod]
    paths:
      - 'docs/env-vars.md'
      - 'CLAUDE.md'
      - 'scripts/check_cross_cache_identity_flags.sh'
      - '.github/workflows/cross-cache-identity-flags.yml'

# Workflow-level GITHUB_TOKEN scope. No job in this file pushes code,
# comments on PRs, or creates releases; all writes to external services
# use their own non-GITHUB_TOKEN secrets. contents:read is the safe floor.
permissions:
  contents: read

jobs:
  check:
    name: Flag-doc consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: bash scripts/check_cross_cache_identity_flags.sh
