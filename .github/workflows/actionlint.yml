name: Workflow Lint

# Static validation for the repo's GitHub Actions workflow files via actionlint
# (https://github.com/rhysd/actionlint). Scoped to changes under
# .github/workflows/** so unrelated PRs aren't slowed (it is sub-second on this
# repo's workflow set). actionlint catches expression-syntax errors, references
# to undefined inputs/secrets/outputs/job-IDs, invalid needs/if/matrix
# declarations, and shell-quoting bugs in `run:` blocks (via shellcheck, which
# is preinstalled on ubuntu-latest). It does NOT catch semantic bugs (e.g. a
# `degraded`-as-success criterion) or behavior that depends on runtime secret
# values. See WXYC/library-metadata-lookup#228.

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/install_actionlint.sh"
  push:
    branches: [main, prod]
    paths:
      - ".github/workflows/**"
      - "scripts/install_actionlint.sh"

# Workflow-level GITHUB_TOKEN scope. This job checks out the repo, downloads a
# public file from raw.githubusercontent.com, and runs a linter. It writes
# nothing back to GitHub, and the one authenticated request it makes is a read
# of a public repo (#1214), so contents:read is both sufficient and the floor.
permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    env:
      # Version-pinned to a release tag (not a SHA), mirroring the repo's CI-pin
      # philosophy (see docs/deployment.md "CI pin maintenance"). Bump by checking
      # the latest release at https://github.com/rhysd/actionlint/releases and
      # updating this version — the download-script ref below interpolates it, so
      # the script tag and the downloaded binary stay in lockstep.
      ACTIONLINT_VERSION: 1.7.12
    steps:
      - uses: actions/checkout@v6
      # rhysd/actionlint publishes no root action.yml, so install the pinned
      # binary via the official download script (also pinned to the release
      # tag). The fetch lives in scripts/install_actionlint.sh rather than
      # inline here so its token-safety and retry properties can be pinned by
      # tests (tests/unit/test_install_actionlint_auth.py) -- see that script's
      # header for the rationale, including why the fetched installer must not
      # inherit this job's token. GH_TOKEN authenticates the
      # raw.githubusercontent.com fetch (#1214, generalizing #1205); the
      # step-level env is only the delivery mechanism. The workflow's
      # contents:read token is enough: rhysd/actionlint is public. The
      # installer writes the binary path to the `executable` step output.
      - name: Download pinned actionlint
        id: get_actionlint
        run: bash scripts/install_actionlint.sh "$ACTIONLINT_VERSION"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Run actionlint
        run: ${{ steps.get_actionlint.outputs.executable }} -color
        shell: bash
