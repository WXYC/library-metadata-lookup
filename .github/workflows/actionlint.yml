name: Workflow Lint

# Static validation for the repo's GitHub Actions workflow files via actionlint
# (https://github.com/rhysd/actionlint). Scoped to changes under
# .github/workflows/** so unrelated PRs aren't slowed (it is sub-second on this
# repo's workflow set). actionlint catches expression-syntax errors, references
# to undefined inputs/secrets/outputs/job-IDs, invalid needs/if/matrix
# declarations, and shell-quoting bugs in `run:` blocks (via shellcheck, which
# is preinstalled on ubuntu-latest). It does NOT catch semantic bugs (e.g. a
# `degraded`-as-success criterion) or behavior that depends on runtime secret
# values. See WXYC/library-metadata-lookup#228.

on:
  pull_request:
    paths:
      - ".github/workflows/**"
  push:
    branches: [main, prod]
    paths:
      - ".github/workflows/**"

# Workflow-level GITHUB_TOKEN scope. This job only checks out the repo and runs
# a linter; it makes no authenticated GitHub API calls. contents:read is the
# safe floor.
permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    env:
      # Version-pinned to a release tag (not a SHA), mirroring the repo's CI-pin
      # philosophy (see docs/deployment.md "CI pin maintenance"). Bump by checking
      # the latest release at https://github.com/rhysd/actionlint/releases and
      # updating this version — the download-script ref below interpolates it, so
      # the script tag and the downloaded binary stay in lockstep.
      ACTIONLINT_VERSION: 1.7.12
    steps:
      - uses: actions/checkout@v6
      # rhysd/actionlint publishes no root action.yml, so install the pinned
      # binary via the official download script (also pinned to the release
      # tag). Fetch the script to a file first rather than `bash <(curl ...)`:
      # process substitution discards curl's exit code, so a transient fetch
      # failure would pass this step green and only surface as a confusing
      # "command not found" at the run step. The script writes the binary path
      # to the `executable` step output.
      - name: Download pinned actionlint
        id: get_actionlint
        run: |
          curl -sSfL \
            "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash" \
            -o "${RUNNER_TEMP}/download-actionlint.bash"
          bash "${RUNNER_TEMP}/download-actionlint.bash" "$ACTIONLINT_VERSION"
        shell: bash
      - name: Run actionlint
        run: ${{ steps.get_actionlint.outputs.executable }} -color
        shell: bash
