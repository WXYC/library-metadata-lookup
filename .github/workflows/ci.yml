name: CI

on:
  push:
    branches: [main, prod]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches: [main, prod]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  codegen-check:
    name: Codegen Freshness
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "datamodel-code-generator[http]" ruff
      - run: bash scripts/generate_api_models.sh
      - name: Check for drift
        run: git diff --exit-code generated/

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install wxyc-etl from source
        run: |
          pip install maturin
          git clone --depth 1 https://github.com/WXYC/wxyc-etl.git /tmp/wxyc-etl
          cd /tmp/wxyc-etl/wxyc-etl-python
          maturin build --release
          pip install /tmp/wxyc-etl/target/wheels/*.whl
      - run: |
          pip install -e ".[dev]"
          pip install mypy
      - run: mypy . --ignore-missing-imports

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install wxyc-etl from source
        run: |
          pip install maturin
          git clone --depth 1 https://github.com/WXYC/wxyc-etl.git /tmp/wxyc-etl
          cd /tmp/wxyc-etl/wxyc-etl-python
          maturin build --release
          pip install /tmp/wxyc-etl/target/wheels/*.whl
      - run: pip install -e ".[dev]"
      - run: pytest tests/unit/ -v --cov=. --cov-report=xml
      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install wxyc-etl from source
        run: |
          pip install maturin
          git clone --depth 1 https://github.com/WXYC/wxyc-etl.git /tmp/wxyc-etl
          cd /tmp/wxyc-etl/wxyc-etl-python
          maturin build --release
          pip install /tmp/wxyc-etl/target/wheels/*.whl
      - run: pip install -e ".[dev]"
      - name: Run E2E tests
        # tests/e2e/test_lookup_e2e.py runs against in-memory SQLite + mock Discogs.
        # tests/e2e/discogs/* requires DISCOGS_TOKEN and self-skips at collection
        # when no credentials are present (see tests/e2e/discogs/conftest.py); it
        # is exercised by the deploy-time integration job, not on every PR.
        env:
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
        run: pytest tests/e2e/ -v -m "e2e"

  test-postgres:
    name: Postgres Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: discogs
          POSTGRES_PASSWORD: discogs
          POSTGRES_DB: discogs
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U discogs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install wxyc-etl from source
        run: |
          pip install maturin
          git clone --depth 1 https://github.com/WXYC/wxyc-etl.git /tmp/wxyc-etl
          cd /tmp/wxyc-etl/wxyc-etl-python
          maturin build --release
          pip install /tmp/wxyc-etl/target/wheels/*.whl
      - run: pip install -e ".[dev]"
      - name: Run Postgres tests
        # Reconciliation tests skip themselves when release_artist is missing,
        # which is fine: the discogs-cache fixture is too large to load in CI.
        # The EntityStore CRUD tests run fully against a fresh schema.
        env:
          DATABASE_URL_TEST: postgresql://discogs:discogs@localhost:5433/discogs
        run: pytest tests/integration/ -v -m "postgres"

  marker-sync:
    name: CI Marker Sync
    uses: WXYC/wxyc-etl/.github/workflows/check-ci-marker-sync.yml@main
    with:
      repo-path: "."
      workflows-dir: ".github/workflows"
      tests-dir: "tests"

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, typecheck, test, e2e, test-postgres]
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy to Railway
        run: railway up --service library-metadata-lookup
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}

  smoke-test-staging:
    name: Smoke Test (Staging)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [deploy-staging]
    steps:
      - name: Wait for deploy to stabilize
        run: sleep 30
      - name: Smoke test
        run: |
          curl -sf https://library-metadata-lookup-staging.up.railway.app/health | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          services = data['services']
          errors = []
          if services['database'] != 'ok':
              errors.append(f\"database: {services['database']}\")
          if services['discogs_api'] != 'ok':
              errors.append(f\"discogs_api: {services['discogs_api']}\")
          cache = services.get('discogs_cache', 'unavailable')
          if cache not in ('ok', 'unavailable'):
              print(f'WARNING: discogs_cache: {cache}')
          if errors:
              print('Smoke test FAILED:', ', '.join(errors))
              sys.exit(1)
          print('Smoke test passed:', json.dumps(services))
          "

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [smoke-test-staging]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install wxyc-etl from source
        run: |
          pip install maturin
          git clone --depth 1 https://github.com/WXYC/wxyc-etl.git /tmp/wxyc-etl
          cd /tmp/wxyc-etl/wxyc-etl-python
          maturin build --release
          pip install /tmp/wxyc-etl/target/wheels/*.whl
      - run: pip install -e ".[dev]"
      - name: Run integration tests
        env:
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          TEST_ENV: staging
        run: pytest tests/integration/ -v -m "integration"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
    needs: [lint, typecheck, test, e2e, test-postgres]
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy to Railway
        run: railway up --service library-metadata-lookup
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}

  smoke-test-production:
    name: Smoke Test (Production)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
    needs: [deploy-production]
    steps:
      - name: Wait for deploy to stabilize
        run: sleep 30
      - name: Smoke test
        run: |
          curl -sf https://library-metadata-lookup-production.up.railway.app/health | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          services = data['services']
          errors = []
          if services['database'] != 'ok':
              errors.append(f\"database: {services['database']}\")
          if services['discogs_api'] != 'ok':
              errors.append(f\"discogs_api: {services['discogs_api']}\")
          cache = services.get('discogs_cache', 'unavailable')
          if cache not in ('ok', 'unavailable'):
              print(f'WARNING: discogs_cache: {cache}')
          if errors:
              print('Smoke test FAILED:', ', '.join(errors))
              sys.exit(1)
          print('Smoke test passed:', json.dumps(services))
          "
