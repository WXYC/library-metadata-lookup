name: CI

on:
  push:
    branches: [main, prod]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches: [main, prod]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"

# Workflow-level GITHUB_TOKEN scope. No job in this file pushes code,
# comments on PRs, or creates releases; all writes to external services
# use their own non-GITHUB_TOKEN secrets. contents:read is the safe floor.
permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'
      # Install the project's pinned ruff (see pyproject.toml dev deps) so a
      # ruff release with new lint rules cannot silently fail this job on an
      # unrelated PR. See WXYC/library-metadata-lookup#249.
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  codegen-check:
    name: Codegen Freshness
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'
      # Install the project's pinned datamodel-code-generator + ruff (see
      # pyproject.toml dev deps) so a new release with different generated-code
      # formatting cannot silently fail this job on an unrelated PR. See
      # WXYC/library-metadata-lookup#249. The script prefers .venv/bin/ then
      # falls back to PATH, where the editable install lands the binaries.
      - run: pip install -e ".[dev]"
      - run: bash scripts/generate_api_models.sh
      # entity/*.sql are the canonical-DDL sidecars for the lml_cache.* store
      # modules (LML#1038): generated from the Python DDL constants, never
      # hand-edited. Two generators (streaming_catalog.py's own, plus the
      # shared one for its seven siblings) cover all 8.
      - run: python -m scripts.regenerate_streaming_catalog_sql
      - run: python -m scripts.regenerate_lml_cache_sql
      - name: Check for drift
        run: git diff --exit-code generated/ entity/*.sql

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'
      # wxyc-etl resolves from PyPI as a transitive dep of `pip install -e ".[dev]"`.
      # `[tool.uv.sources]` in pyproject.toml is uv-only and doesn't apply to pip.
      - run: pip install -e ".[dev]"
      - run: mypy . --ignore-missing-imports

  test:
    name: Default Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'
      - run: pip install -e ".[dev]"
      # Default `pytest` honours pyproject addopts (`-m 'not pg and not external_api'`),
      # so this job runs every unmarked test across tests/unit/, tests/integration/, and
      # tests/e2e/. Infra-tagged tests run in their own jobs (`pg`, `external_api`).
      #
      # -n auto (pytest-xdist) fans this job's ~5k tests across the runner's cores.
      # It runs the unit, integration, and e2e tiers together (all three are
      # unmarked), so every test here must be parallel-safe: process-global state is
      # reset per-worker by the autouse fixtures in tests/conftest.py, and any
      # on-disk fixture must use tmp_path (never a fixed relative path) so two
      # workers can't collide on the same file. --cov combines per-worker coverage
      # automatically. xdist is scoped to this job only — the pg / external_api jobs
      # stay serial (they share a PG schema / the Discogs rate budget). --durations
      # surfaces the slowest tests so a serial-wait backslide (e.g. an un-mocked
      # sleep) is visible in the log instead of silently re-inflating the run.
      - name: Run tests
        env:
          # sys.monitoring line tracer (Python 3.12 + coverage >= 7.4): lower
          # per-line coverage overhead than the default C trace core, verified to
          # produce identical line counts (line-rate 0.8717 either way).
          COVERAGE_CORE: sysmon
        run: pytest -n auto --cov=. --cov-report=xml --durations=15
      - name: Upload coverage reports
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  external_api:
    name: External API Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'
      - run: pip install -e ".[dev]"
      - name: Run external_api tests
        # tests/e2e/discogs/* and the real-API classes in tests/integration/test_api_discogs.py
        # require DISCOGS_TOKEN. They self-skip at collection if no credentials are present
        # (PR runs from forks may have no secret access).
        env:
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
        run: pytest -v -m "external_api"

  pg:
    name: PG Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: discogs
          POSTGRES_PASSWORD: discogs
          POSTGRES_DB: discogs
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U discogs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'
      - run: pip install -e ".[dev]"
      - name: Run PG tests
        # EntityStore CRUD runs end-to-end against a fresh schema. Reconciliation tests
        # skip themselves when release_artist is missing -- the discogs-cache fixture is
        # too large to load in CI. test_va_discogs_lookup.py self-skips without
        # DATABASE_URL_DISCOGS, which is intentional in CI.
        env:
          DATABASE_URL_TEST: postgresql://discogs:discogs@localhost:5433/discogs
        run: pytest -v -m "pg"

  marker-sync:
    name: CI Marker Sync
    uses: WXYC/wxyc-etl/.github/workflows/check-ci-marker-sync.yml@gha/v1
    with:
      repo-path: "."
      workflows-dir: ".github/workflows"
      tests-dir: "tests"
      wxyc-etl-ref: gha/v1

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # external_api is intentionally NOT a deploy gate — Discogs drift is an external
    # availability signal, not a precondition for shipping our own code. The job
    # still runs and reports per-PR; a red status is visible without blocking the
    # deploy chain. See WXYC/library-metadata-lookup#208.
    needs: [lint, typecheck, test, pg]
    steps:
      - uses: actions/checkout@v6
      - name: Install Railway CLI
        run: npm install -g @railway/cli@4.58.0
      # `railway up` is a CLI source-deploy and carries no git metadata, so
      # RAILWAY_GIT_COMMIT_SHA is absent on the live deploy. Bake the SHA into
      # the uploaded working directory so /health can report it. See LML#509.
      - name: Record deployed commit SHA for /health
        run: echo "${{ github.sha }}" > COMMIT_SHA
      # `--detach --json` returns as soon as the upload is accepted, prints
      # {"deploymentId": ..., "logsUrl": ...} and nothing else on stdout, and never opens a log
      # stream. Plain `railway up` streams build logs and hard-exits 1 if that stream drops --
      # and only in "CI mode", which $CI auto-enables on every Actions runner. That turned
      # transient log-transport hiccups into a red deploy while the deployment went live
      # (railwayapp/cli v4.58.0 src/commands/up.rs:240, :275-279). The wait step is the real gate.
      - name: Deploy to Railway
        id: deploy
        run: |
          railway up --detach --json --service library-metadata-lookup > "$RUNNER_TEMP/deploy.json"
          jq -e . "$RUNNER_TEMP/deploy.json"
          {
            echo "deployment_id=$(jq -er .deploymentId "$RUNNER_TEMP/deploy.json")"
            echo "logs_url=$(jq -er .logsUrl "$RUNNER_TEMP/deploy.json")"
          } >> "$GITHUB_OUTPUT"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
      # Polls the deployment API for the real terminal status. Stronger than the old gate:
      # `railway up` returned when the *build* finished, SUCCESS here means Railway's healthcheck
      # passed and the revision is serving.
      - name: Wait for deployment to go live
        run: ./scripts/wait_for_railway_deployment.sh library-metadata-lookup "$DEPLOYMENT_ID" "$LOGS_URL"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
          LOGS_URL: ${{ steps.deploy.outputs.logs_url }}

  smoke-test-staging:
    name: Smoke Test (Staging)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [deploy-staging]
    steps:
      - name: Wait for deploy to stabilize
        run: sleep 30
      - name: Smoke test
        run: |
          curl -sf https://library-metadata-lookup-staging.up.railway.app/health | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          services = data['services']
          errors = []
          if services['database'] != 'ok':
              errors.append(f\"database: {services['database']}\")
          if services['discogs_api'] != 'ok':
              errors.append(f\"discogs_api: {services['discogs_api']}\")
          # Deploy identity must be present: a null commit_sha is the LML#509
          # regression (file dropped from the image, or the SHA-less deploy won).
          commit_sha = data.get('commit_sha')
          if not commit_sha:
              errors.append(f'commit_sha is {commit_sha!r} (deploy identity missing -- LML#509)')
          cache = services.get('discogs_cache', 'unavailable')
          if cache not in ('ok', 'unavailable'):
              print(f'WARNING: discogs_cache: {cache}')
          if errors:
              print('Smoke test FAILED:', ', '.join(errors))
              sys.exit(1)
          print('Smoke test passed: commit_sha=', commit_sha, json.dumps(services))
          "

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
    # external_api is intentionally NOT a deploy gate — see deploy-staging for the rationale.
    needs: [lint, typecheck, test, pg]
    steps:
      - uses: actions/checkout@v6
      - name: Install Railway CLI
        run: npm install -g @railway/cli@4.58.0
      # `railway up` is a CLI source-deploy and carries no git metadata, so
      # RAILWAY_GIT_COMMIT_SHA is absent on the live deploy. Bake the SHA into
      # the uploaded working directory so /health can report it. See LML#509.
      - name: Record deployed commit SHA for /health
        run: echo "${{ github.sha }}" > COMMIT_SHA
      # See deploy-staging for why this is `--detach --json` plus an explicit wait.
      - name: Deploy to Railway
        id: deploy
        run: |
          railway up --detach --json --service library-metadata-lookup > "$RUNNER_TEMP/deploy.json"
          jq -e . "$RUNNER_TEMP/deploy.json"
          {
            echo "deployment_id=$(jq -er .deploymentId "$RUNNER_TEMP/deploy.json")"
            echo "logs_url=$(jq -er .logsUrl "$RUNNER_TEMP/deploy.json")"
          } >> "$GITHUB_OUTPUT"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}
      - name: Wait for deployment to go live
        run: ./scripts/wait_for_railway_deployment.sh library-metadata-lookup "$DEPLOYMENT_ID" "$LOGS_URL"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
          LOGS_URL: ${{ steps.deploy.outputs.logs_url }}

  smoke-test-production:
    name: Smoke Test (Production)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
    needs: [deploy-production]
    steps:
      - name: Wait for deploy to stabilize
        run: sleep 30
      - name: Smoke test
        run: |
          curl -sf https://library-metadata-lookup-production.up.railway.app/health | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          services = data['services']
          errors = []
          if services['database'] != 'ok':
              errors.append(f\"database: {services['database']}\")
          if services['discogs_api'] != 'ok':
              errors.append(f\"discogs_api: {services['discogs_api']}\")
          # Deploy identity must be present: a null commit_sha is the LML#509
          # regression (file dropped from the image, or the SHA-less deploy won).
          commit_sha = data.get('commit_sha')
          if not commit_sha:
              errors.append(f'commit_sha is {commit_sha!r} (deploy identity missing -- LML#509)')
          cache = services.get('discogs_cache', 'unavailable')
          if cache not in ('ok', 'unavailable'):
              print(f'WARNING: discogs_cache: {cache}')
          if errors:
              print('Smoke test FAILED:', ', '.join(errors))
              sys.exit(1)
          print('Smoke test passed: commit_sha=', commit_sha, json.dumps(services))
          "
